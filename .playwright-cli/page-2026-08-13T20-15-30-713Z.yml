          - heading "6. Implement the heart of the state machine" [level=2] [ref=e331]
          - paragraph [ref=e332]: The important method is short because the decisions were made in the model. Stopping consumes a tick; reversing also consumes a tick. That makes the simulation deterministic and easy to verify.
          - code [ref=e334]: "class Elevator { tick(): void { if (this.requests.isEmpty()) { this.direction = Direction.IDLE return } if (this.direction === Direction.IDLE) { this.direction = this.directionTowardNearestRequest() } if (this.hasMatchingStopAtCurrentFloor()) { this.serveCurrentFloor() return } if (!this.hasRequestsAhead(this.direction)) { this.direction = this.direction.opposite() return } this.currentFloor += this.direction === Direction.UP ? 1 : -1 } }"
          - paragraph [ref=e335]:
            - text: "Notice what is absent: hardcoded checks for floor"
            - code [ref=e336]: "0"
            - text: and floor
            - code [ref=e337]: "9"
            - text: . Valid requests and
            - code [ref=e338]: hasRequestsAhead()
            - text: naturally prevent crossing the boundary.
          - heading "7. Verify with scenarios, not hope" [level=2] [ref=e339]
          - paragraph [ref=e340]: "A compact test suite should cover behavior, invariants, and awkward transitions:"
          - list [ref=e341]:
            - listitem [ref=e342]: An idle car moves toward its nearest request.
            - listitem [ref=e343]: A car moving UP passes a DOWN pickup and serves it after reversing.
            - listitem [ref=e344]: A destination is served regardless of hall-call direction.
            - listitem [ref=e345]: Duplicate requests do not create duplicate stops.
            - listitem [ref=e346]: An invalid floor is rejected without changing state.
            - listitem [ref=e347]: The final request makes the car IDLE.
            - listitem [ref=e348]: Equal-distance dispatch has a deterministic tie-breaker.
          - complementary [ref=e349]:
            - generic [ref=e353]:
              - paragraph [ref=e354]: Say the scenario aloud
              - paragraph [ref=e356]: "Walking through one tick at a time exposes ordering bugs: should the car stop before moving, reverse before stopping, or become idle after consuming the last request? Make that order explicit."
          - heading "8. Handle the interviewer twist" [level=2] [ref=e357]
          - paragraph [ref=e358]:
            - strong [ref=e359]: “Add express elevators.”
            - text: Give an elevator a service policy that validates supported floors; let dispatch prefer eligible express cars. The request object does not change.
          - paragraph [ref=e360]:
            - strong [ref=e361]: “Hall calls arrive concurrently.”
            - text: Make selection plus assignment atomic, or feed incoming calls through a thread-safe queue that the controller drains at the start of a tick.
          - paragraph [ref=e362]:
            - strong [ref=e363]: “Show estimated arrival time.”
            - text: Add a pure estimator to the dispatch strategy. Do not let the UI simulate private elevator mutations just to calculate an ETA.
          - generic [ref=e364]:
