          - heading "6. Keep makeMove atomic" [level=2] [ref=e280]
          - paragraph [ref=e281]: Return a result instead of making callers infer what happened. The UI can then render errors without reaching into the domain model.
          - code [ref=e283]: "makeMove(row: number, col: number): MoveResult { if (this.status !== GameStatus.IN_PROGRESS) { return MoveResult.rejected(\"GAME_FINISHED\") } const placed = this.board.place(row, col, this.currentPlayer.mark) if (!placed) return MoveResult.rejected(\"CELL_OCCUPIED\") this.status = this.winningRule.evaluate(this.board) if (this.status === GameStatus.IN_PROGRESS) { this.currentPlayerIndex = 1 - this.currentPlayerIndex } return MoveResult.accepted(this.status) }"
          - paragraph [ref=e284]: "For the fixed board, rule evaluation stays direct:"
          - code [ref=e286]: "evaluate(board: Board): GameStatus { for (const [a, b, c] of WINNING_LINES) { if (board.markAt(a) !== null && board.markAt(a) === board.markAt(b) && board.markAt(a) === board.markAt(c)) { return board.markAt(a) === Mark.X ? X_WON : O_WON } } return board.isFull() ? DRAW : IN_PROGRESS }"
